<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Der Eisendrache - Whisper</title>
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header" aria-label="ページヘッダー">
      <div class="app-header-title">Der Eisendrache - Whisper</div>
      <button class="menu-toggle" id="menuToggleBtn" type="button" aria-label="メニューを開く" aria-controls="menuPanel" aria-expanded="false">☰</button>
    </header>

    <div class="menu-panel" id="menuPanel" aria-hidden="true">
      <div class="menu-panel-inner">
        <div class="menu-header">
          <span>メニュー</span>
          <button class="menu-toggle" id="menuCloseBtn" type="button" aria-label="メニューを閉じる">✕</button>
        </div>

        <div class="menu-rename-trigger">
          <button class="btn btn-primary" id="showAreaTitleEditorBtn" type="button">候補地名変更</button>
        </div>

        <div class="menu-title-list hidden" id="areaTitleEditor">
          <div id="editorRowsContainer" class="editor-rows"></div>
        </div>

        <div class="menu-actions hidden" id="areaTitleActions">
          <button class="btn btn-primary" id="saveRoomTitleBtn" type="button">保存</button>
          <button class="btn btn-neutral" id="resetRoomTitleBtn" type="button">初期値に戻す</button>
        </div>

        <hr class="menu-divider" />

        <div class="menu-actions menu-actions--top-gap">
          <button class="btn" id="showHomeBtn" type="button">トップへ戻る</button>
        </div>
      </div>
    </div>

    <main class="app-shell">
      <div class="share-panel">
        <div class="share-row">
          <label for="roomIdInput">ルームID</label>
          <input id="roomIdInput" type="text" maxlength="20" autocomplete="off" placeholder="例: party-001" aria-label="ルームID" />
          <button class="btn btn-primary" id="joinRoomBtn" type="button">適用</button>
          <button class="btn btn-primary" id="copyRoomBtn" type="button">URLをコピー</button>
          <button class="btn btn-leave" id="leaveRoomBtn" type="button">退出</button>
        </div>
        <div class="share-status-container">
          <div class="share-status-row">
            <div id="shareStatus" class="share-status">ローカルモード</div>
            <div id="roomMetaInfo" class="room-meta-info"></div>
          </div>
          <div id="roomMemberListDropdown" class="room-member-list-dropdown"></div>
        </div>
      </div>

      <section class="panel">
        <div class="control-row control-row--gap">
          <span class="label label--block">プレイヤー人数</span>
          <div class="btn-group" id="playerCountGroup">
            <button type="button" class="btn player-btn active" data-count="1">1人</button>
            <button type="button" class="btn player-btn" data-count="2">2人</button>
            <button type="button" class="btn player-btn" data-count="3">3人</button>
            <button type="button" class="btn player-btn" data-count="4">4人</button>
          </div>
        </div>

        <div class="reset-row">
          <button id="resetBtn" class="btn btn-neutral">リセット</button>
        </div>

        <div class="board-header board-header--divider">
          <div>
            <h2 id="selectedLabel" class="selected-label">未選択</h2>
          </div>
        </div>

        <div class="section-title">次の候補地</div>
        <div id="candidateButtons" class="candidate-grid" aria-live="polite"></div>

        <div id="historySection" class="history-section">
          <div class="section-title">履歴</div>
          <div id="historyContainer" class="history-container"></div>
        </div>
      </section>
    </main>

    <script src="../shared/shared.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
